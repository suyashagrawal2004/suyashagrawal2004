<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="EduHire radius search: teachers within 5 km of a school light up and are ranked by distance; top match 1.8 km away." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>EduHire - 5 km radius match</title>
