<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="ZapFee receipt printing: course fee 42,372.88 plus 18% GST 7,627.12 totals 50,000.00; debit receivable equals credits to income and GST payable, stamped Dr = Cr." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>ZapFee - invoice with balanced double entry</title>
  <defs>
    <style>
      @font-face{font-family:'SA Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'SA Mono';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}
      .m { font-family: 'SA Mono','JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace; }
      .print { animation: print 7.0s infinite; }
      @keyframes print {
        0%   { transform: translateY(-188px); opacity: 1; animation-timing-function: steps(16, end); }
        26%  { transform: translateY(0); opacity: 1; }
        86%  { transform: translateY(0); opacity: 1; }
        96%  { transform: translateY(0); opacity: 0; }
        100% { transform: translateY(-188px); opacity: 0; }
      }
      .stamp { transform-box: fill-box; transform-origin: center; animation: stamp 7.0s infinite; }
      @keyframes stamp {
        0%, 29% { opacity: 0; transform: rotate(-9deg) scale(1.7); }
        33%     { opacity: 1; transform: rotate(-9deg) scale(1); }
        86%     { opacity: 1; transform: rotate(-9deg) scale(1); }
        96%, 100% { opacity: 0; transform: rotate(-9deg) scale(1); }
      }
      .pulse { animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) { .print, .stamp, .pulse { animation: none; } }
    </style>
