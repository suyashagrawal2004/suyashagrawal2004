name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"      # daily at 00:00 UTC
  workflow_dispatch:           # lets you run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Dot ramps are GitHub's own contribution palettes with the hue
          # rotated to the profile's vermilion; lightness per step is unchanged,
          # so the grid reads exactly like the green one. Level 0 stays
          # GitHub's empty-cell color so untouched days don't glow.
          outputs: |
            dist/github-snake.svg?color_snake=#0E0F12&color_dots=#EBEDF0,#E9AD9B,#C45F40,#A14A30,#6E3321
            dist/call-snake.svg?color_snake=#F2ECE3&color_dots=#161B22,#441B0E,#6D1900,#A64426,#D35D39

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
