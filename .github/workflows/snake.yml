name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"      # daily at 00:00 UTC
  workflow_dispatch:           # lets you run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Dots use GitHub's own contribution greens, so the snake's grid
          # matches the real graph above it. Only the snake carries the accent.
          outputs: |
            dist/github-snake.svg?color_snake=#FF5A36&color_dots=#EBEDF0,#9BE9A8,#40C463,#30A14E,#216E39
            dist/call-snake.svg?color_snake=#FF5A36&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
